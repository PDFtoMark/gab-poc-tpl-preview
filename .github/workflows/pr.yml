name: "Pull Request"

# Attacker-controlled version of the producer workflow (runs from the PR head,
# unprivileged, no secrets). It uploads an artifact named `pr_id` whose contents
# land in the privileged workflow's workspace.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

env:
  PR_ID: ${{ github.event.number }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Stage attacker-controlled artifact
        run: |
          mkdir -p staging/cli/dist
          echo "$PR_ID" > staging/_pr_id.txt
          cp evil-cli.js staging/cli/dist/index.js
          find staging -type f -print

      - name: Upload PR ID
        uses: actions/upload-artifact@v4
        with:
          name: pr_id
          path: staging
