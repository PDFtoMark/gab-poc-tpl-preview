name: "Pull Request"

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

env:
  PR_ID_FILE: "_pr_id.txt"
  PR_ID: ${{ github.event.number }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Save PR ID
        run: echo "$PR_ID" > ${{ env.PR_ID_FILE }}

      - name: Upload PR ID
        uses: actions/upload-artifact@v4
        with:
          name: pr_id
          path: ${{ env.PR_ID_FILE }}
