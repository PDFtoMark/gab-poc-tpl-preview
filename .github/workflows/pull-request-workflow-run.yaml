name: "Pull Request Workflow Run"

# PoC mirror of cloudflare/templates .github/workflows/pull-request-workflow-run.yaml
on:
  workflow_run:
    workflows: ["Pull Request"]
    types:
      - completed

permissions:
  pull-requests: write

env:
  PR_ID_FILE: "_pr_id.txt"
  PREVIEW_DIR: "_preview-templates"
  ALLOW_PREVIEW_LABEL: "allow preview"

jobs:
  preview:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FAKE_TEMPLATES_API_CLIENT_SECRET: ${{ secrets.FAKE_TEMPLATES_API_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      # models `./.github/actions/setup` (pnpm install builds/links the cli)
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install workspace
        run: pnpm install --no-frozen-lockfile --child-concurrency=10

      - name: Download PR ID
        uses: actions/download-artifact@v4
        with:
          name: pr_id
          github-token: ${{ env.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - shell: bash
        run: |
          value=`cat ${{ env.PR_ID_FILE }}`
          echo PR_ID=$value >> $GITHUB_ENV
          echo "trigger head repo: ${{ github.event.workflow_run.head_repository.full_name }}"

      - name: "Download pull request info"
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: process.env.PR_ID,
            })
            const allowPreview = pr.labels?.find((label) => label.name == process.env.ALLOW_PREVIEW_LABEL)
            fs.appendFileSync(process.env.GITHUB_ENV, `PR_REPOSITORY=${pr.head.repo.full_name}\n`)
            fs.appendFileSync(process.env.GITHUB_ENV, `PR_REF=${pr.head.ref}\n`)
            fs.appendFileSync(process.env.GITHUB_ENV, `PR_SHA_SHORT=${pr.head.sha.slice(0, 7)}\n`)
            if (allowPreview) {
              fs.appendFileSync(process.env.GITHUB_ENV, 'PR_ALLOW_PREVIEW=true\n')
            }
            console.log(`looked up PR #${process.env.PR_ID}: head=${pr.head.repo.full_name}:${pr.head.ref} allowPreview=${!!allowPreview}`)

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PR_REPOSITORY }}
          ref: ${{ env.PR_REF }}
          path: ${{ env.PREVIEW_DIR }}
          persist-credentials: "false"

      - name: "Make preview"
        run: |
          pnpm -w preview $PREVIEW_DIR \
            --repoFullName $PR_REPOSITORY \
            --branch $PR_REF \
            --pr $PR_ID \
            --hash $PR_SHA_SHORT
        continue-on-error: true

      - name: Show exfiltrated state
        run: |
          echo "--- bin target ---"; ls -l node_modules/.bin/templates 2>/dev/null || true
          echo "--- cli/dist/index.js head ---"; head -3 cli/dist/index.js
          for f in leak leak2; do if [ -f "$f" ]; then echo "--- $f ---"; cat "$f"; fi; done
